[package]
name = "draw-bot-web-backend"
version = "0.1.0"
edition = "2024"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
headers = "0.4.2"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.28.0", features = ["v4"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
tower-http = { version = "0.7.1", features = ["trace"] }
